keywords:   # applied to name + description as additive deltas after pooling
  - {pattern: "\\b(fried|crispy|crisp|crunchy|battered|tempura|fritter)s?\\b", delta: {crunch: 4, richness: 1}}
  - {pattern: "\\b(cream|creamy|makhani|malai|butter)\\b", delta: {creaminess: 3, richness: 3}}
  - {pattern: "\\b(hot|fiery|vindaloo|phaal|phal|madras|jalfrezi|diablo|arrabbiata|piri piri|peri peri)\\b", delta: {spice: 4}}
  - {pattern: "\\b(vindaloo|phaal|phal)\\b", delta: {spice: 3, sour: 2}}
  - {pattern: "\\b(mild|korma|pasanda)\\b", delta: {spice: -2}}
  - {pattern: "\\b(tangy|zesty|pickled|sour)\\b", delta: {sour: 3}}
  - {pattern: "\\b(sweet|glazed|candied|honey)\\b", delta: {sweet: 2}}
  - {pattern: "\\b(chargrilled|grilled|tandoori|smoked|roasted)\\b", delta: {umami: 1}}
  - {pattern: "\\b(salad|steamed|light)\\b", delta: {richness: -2}}
  - {pattern: "\\b(cheesy|loaded|stuffed|rich)\\b", delta: {richness: 2}}
  - {pattern: "\\b(dessert|cake|pudding|tart)\\b", delta: {sweet: 4}}
